name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  terraform:
    name: Terraform (infra Cloudflare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_encryption_key: ${{ secrets.GW2_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - run: terraform init

      - run: terraform apply -auto-approve

  deploy-api:
    name: Deploy Worker code (wrangler)
    needs: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # CREATE TABLE IF NOT EXISTS partout dans schema.sql : sans danger à rejouer.
      - name: Apply D1 schema
        run: npx wrangler d1 execute gw2-guild-tool-dev --remote --file=./schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy

  deploy-gui:
    name: Deploy GUI (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gui
      - id: deployment
        uses: actions/deploy-pages@v4
