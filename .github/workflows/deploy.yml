name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Idempotent : garde le secret du Worker synchro avec GitHub, utile
      # aussi si on doit un jour redéployer sur un compte Cloudflare vierge.
      - name: Sync ENCRYPTION_KEY secret
        run: npx wrangler secret put ENCRYPTION_KEY <<< "${{ secrets.GW2_ENCRYPTION_KEY }}"

      # CREATE TABLE IF NOT EXISTS partout dans schema.sql : sans danger à rejouer.
      - name: Apply D1 schema
        run: npx wrangler d1 execute gw2-guild-tool-dev --remote --file=./schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy

  deploy-gui:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gui
      - id: deployment
        uses: actions/deploy-pages@v4
