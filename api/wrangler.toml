name = "gw2-guild-api-dev"
main = "src/index.js"
compatibility_date = "2026-08-01"
account_id = "8cfbb71203c475ce15c0f1d522670443"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "gw2-guild-tool-dev"
database_id = "8b34ecb8-4136-43f9-96e9-2424a8825062"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "gw2_guild_tool_events"

# Autorise /admin/bootstrap tant qu'aucun admin n'existe encore (auto-promotion
# du compte connecté qui appelle l'endpoint). À repasser à "false" une fois le
# premier admin en place — voir README pour la procédure complète.
[vars]
SUPER_ADMIN_MODE = "false"
# Le client ID OAuth n'est pas sensible (il apparaît en clair dans l'URL de
# redirection vers Google) — seul GOOGLE_CLIENT_SECRET est un secret Worker.
GOOGLE_CLIENT_ID = "377554935402-pb47t575sd52framek4qe7quj1fvr485.apps.googleusercontent.com"
